<div id="dashboard-screen" class="app-page hidden-right">

    <div class="dashboard-header">

        <div class="user-avatar"></div>

        <div class="header-actions">

            <button class="left-btn" id="btn-olho">
                <img src="../fotos/olho.png" id="img-olho" alt="Olho">
            </button>

            <button class="config-btn">
                <img src="../fotos/configs.png" alt="Configurações">
            </button>

        </div>

    </div>

    <div class="dashboard-user">
        <h2>Olá, Dhenzel Ribeiro!</h2>
    </div>

    <div class="saldo-card">

        <div class="saldo-info">

            <p>Saldo</p>

            <h1 id="saldo-dashboard">R$ 2560,32</h1>

        </div>

        <div class="saldo-arrow">
            >
        </div>

    </div>

    <div class="dashboard-actions">

        <button class="dash-action">

            <div class="action-icon">
                <img src="../fotos/pix.png" alt="Pix">
            </div>

            <span>Pix</span>

        </button>

        <button class="dash-action">

            <div class="action-icon">
                <img src="../fotos/boleto.png" alt="Pix">
            </div>

            <span>Pagar</span>

        </button>

        <button class="dash-action">

            <div class="action-icon">
                <img src="../fotos/celular.png" alt="Pix">
            </div>


            <span>Recarga</span>

        </button>

    </div>

    <div class="credito-card">

        <h2>Cartão de crédito</h2>

        <p class="fatura-label">
            Fatura atual
        </p>

        <h1>R$ 2560,32</h1>

        <p class="limite-texto">
            Limite disponível: R$ 206,23
        </p>

    </div>

    <button class="meus-cartoes-btn">

        <span>
            ▬
        </span>

        Meus cartões

    </button>

    <button class="dashboard-sair-btn" id="btn-sair">
        Sair da conta
    </button>

</div>
