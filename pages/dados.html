<div id="dados-screen" class="app-page hidden-right">

    <div class="cadastro-top">
        <div class="top-buttons">
            <button class="btn-back" id="btn-voltar-cpf">
                Voltar
            </button>

            <button class="btn-close" id="btn-fechar-dados">
                ✕
            </button>
        </div>
    </div>

    <div class="cadastro-header">
        <h1>Informe seus dados pessoais</h1>

        <h2 class="titulo-nome">Nome</h2>

        <div class="cadastro-form">
            <input type="text" placeholder="Digite seu nome completo">
        </div>

        <h2 class="titulo-data">Data de nascimento:</h2>

        <div class="cadastro-form">
            <input type="text" id="data-nascimento" placeholder="DD/MM/AAAA">
        </div>

        <button class="btn-continuar" id="btn-continuar-dados" type="button">
            Continuar
        </button>
    </div>

</div>
