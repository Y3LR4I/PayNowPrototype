<div id="pix-screen" class="app-page hidden-right">

    <div class="pix-header">
        <button class="pix-back-btn" id="btn-voltar-pix">
            ←
        </button>
        <h1>Transferências Pix</h1>
        <div></div>
    </div>

    <div class="pix-actions">

        <button class="pix-action-card">
            <div class="pix-card-icon">
                <span class="icon-arrow">↗</span>
            </div>
            <div class="pix-card-content">
                <h3>Transferir</h3>
                <p>Pix para qualquer chave</p>
            </div>
            <span class="pix-card-arrow">></span>
        </button>

        <button class="pix-action-card">
            <div class="pix-card-icon">
                <span class="icon-qr">⊞</span>
            </div>
            <div class="pix-card-content">
                <h3>Receber com QR Code</h3>
                <p>Gere um QR Code para receber</p>
            </div>
            <span class="pix-card-arrow">></span>
        </button>

        <button class="pix-action-card">
            <div class="pix-card-icon">
                <span class="icon-keys">🔑</span>
            </div>
            <div class="pix-card-content">
                <h3>Minhas chaves Pix</h3>
                <p>Gerenciar chaves cadastradas</p>
            </div>
            <span class="pix-card-arrow">></span>
        </button>

    </div>

    <div class="pix-keys-section">
        <div class="pix-keys-header">
            <h2>Suas chaves</h2>
            <button class="pix-add-key">+ Adicionar</button>
        </div>

        <div class="pix-key-item">
            <div class="pix-key-icon">📧</div>
            <div class="pix-key-info">
                <p class="pix-key-type">E-mail</p>
                <p class="pix-key-value">joao@email.com</p>
            </div>
            <span class="pix-key-arrow">></span>
        </div>

        <div class="pix-key-item">
            <div class="pix-key-icon">📱</div>
            <div class="pix-key-info">
                <p class="pix-key-type">Telefone</p>
                <p class="pix-key-value">(11) 98765-4321</p>
            </div>
            <span class="pix-key-arrow">></span>
        </div>

    </div>

</div>
