<div id="extrato-screen" class="app-page hidden-right">

    <div class="extrato-header">
        <button class="extrato-back-btn" id="btn-voltar-extrato">
            ←
        </button>
        <h2>Conta</h2>
        <button class="extrato-eye-btn" id="btn-olho-extrato">
            <img src="./fotos/olho.png" id="img-olho-extrato" alt="Olho">
        </button>
    </div>

    <div class="saldo-card-extrato">
        <div class="saldo-info">
            <p>Saldo</p>
            <h1 id="saldo-valor">R$ 2560,32</h1>
        </div>
        <div class="saldo-arrow">></div>
    </div>

    <div class="balanco-card">

        <h3>Balanço mensal</h3>

        <div class="balanco-item">
            <span>Entradas</span>
            <strong class="balanco-entrada">
                +R$ 3.450,00
            </strong>
        </div>

        <div class="balanco-item">
            <span>Saídas</span>
            <strong class="balanco-saida">
                -R$ 889,68
            </strong>
        </div>

    </div>

    <div class="transacoes-container">
        <h3>Últimas transações</h3>

        <div class="transacoes-list">
            <div class="transacao-item">
                <div class="transacao-left">
                    <div class="icon-circle icon-received">↓</div>
                    <div class="transacao-detalhes">
                        <h4>Pix recebido</h4>
                        <p>João da Silva</p>
                    </div>
                </div>
                <div class="transacao-right valor-positivo">
                    <span class="valor">+R$ 150,00</span>
                    <span class="data">20/05</span>
                </div>
            </div>

            <div class="transacao-item">
                <div class="transacao-left">
                    <div class="icon-circle icon-sent">↑</div>
                    <div class="transacao-detalhes">
                        <h4>Pix enviado</h4>
                        <p>Maria Santos</p>
                    </div>
                </div>
                <div class="transacao-right valor-negativo">
                    <span class="valor">-R$ 89,50</span>
                    <span class="data">19/05</span>
                </div>
            </div>

            <div class="transacao-item">
                <div class="transacao-left">
                    <div class="icon-circle icon-sent">↑</div>
                    <div class="transacao-detalhes">
                        <h4>Pix enviado</h4>
                        <p>Carlos Oliveira</p>
                    </div>
                </div>
                <div class="transacao-right valor-negativo">
                    <span class="valor">-R$ 45,00</span>
                    <span class="data">19/05</span>
                </div>
            </div>

        </div>
    </div>

    <button class="ver-extrato-btn">Mostrar extrato</button>

</div>
