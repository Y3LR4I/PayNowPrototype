<div id="contato-screen" class="app-page hidden-right">

    <div class="cadastro-top">
        <div class="top-buttons">

            <button class="btn-back" id="btn-voltar-contato">
                Voltar
            </button>

            <button class="btn-close" id="btn-fechar-contato">
                ✕
            </button>

        </div>
    </div>

    <div class="cadastro-header">

        <h1>Agora, informe seus contatos</h1>

        <h2 class="titulo-nome">Telefone/Celular</h2>

        <div class="cadastro-form">
            <input type="text" id="telefone" placeholder="(00) 00000-0000">
        </div>

        <h2 class="titulo-nome">E-mail</h2>

        <div class="cadastro-form">
            <input type="email" id="email" placeholder="Digite seu e-mail">
        </div>

        <button class="btn-continuar" id="btn-continuar-contato" type="button">
            Continuar
        </button>

    </div>

</div>
