<div id="email-screen" class="app-page hidden-right">

    <div class="cadastro-top">
        <div class="top-buttons">

            <button class="btn-back" id="btn-voltar-email">
                Voltar
            </button>

            <button class="btn-close" id="btn-fechar-email">
                ✕
            </button>

        </div>
    </div>

    <div class="brand email-brand">
        <h1>Pay<span>Now</span></h1>
        <p class="brand-sub">Conta digital para MEI´s</p>
    </div>

    <div class="email-content">

        <h1 class="titulo-confirmacao">
            Digite o código
        </h1>

        <p class="subtitulo-confirmacao">
            Enviamos um código de 6 dígitos para seu email
        </p>

        <p class="email-mascarado" id="email-mascarado">
            i******@gmail.com
        </p>

        <div class="codigo-container">

            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">

        </div>

        <button class="btn-continuar" id="btn-confirmar-email">
            Continuar
        </button>

        <p class="reenviar-codigo">
            Reenviar código
        </p>

    </div>

</div>
